<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada | elJulioDev</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="static/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0e11;
      --text: #f2f3f0;
      --text-muted: #8b92a0;
      --volt: #afff47;
      --font-body: "Inter", system-ui, sans-serif;
      --font-heading: "Bebas Neue", sans-serif;
      --font-mono: "Space Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 15vw, 10rem);
      line-height: 1;
      color: var(--volt);
    }
    h1 {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      margin: 0.5rem 0;
    }
    p { color: var(--text-muted); margin-bottom: 2rem; max-width: 40ch; }
    .btn {
      display: inline-block;
      padding: 13px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      background: var(--volt);
      color: var(--bg);
      text-decoration: none;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .btn:hover {
      background: #c8ff4d;
      box-shadow: 0 0 0 3px rgba(182, 236, 112, 0.25);
    }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Página no encontrada</h1>
  <p>La página que buscas no existe o fue movida. Puedes volver al inicio.</p>
  <a href="index.html" class="btn">Volver al inicio</a>
</body>
</html>
